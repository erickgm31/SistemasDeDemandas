<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zoo Demandas</title>
<style>
  :root {
    --fundo: #edf1ea;
    --papel: #ffffff;
    --texto: #1f2a22;
    --suave: #5b6a60;
    --linha: #cdd6cc;
    --destaque: #2f6b3f;
    --ok: #1d7a46;
    --erro: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--fundo);
    color: var(--texto);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  }
  main {
    width: 100%;
    max-width: 460px;
    background: var(--papel);
    border: 1px solid var(--linha);
    border-radius: 10px;
    padding: 28px;
  }
  h1 { margin: 0 0 4px; font-size: 1.4rem; }
  p.sub { margin: 0 0 22px; color: var(--suave); font-size: .95rem; }
  label { display: block; margin-bottom: 14px; font-size: .92rem; font-weight: 600; }
  input, select, textarea {
    display: block;
    width: 100%;
    margin-top: 6px;
    padding: 10px 12px;
    border: 1px solid var(--linha);
    border-radius: 6px;
    font: inherit;
    font-weight: 400;
    color: var(--texto);
    background: #fff;
  }
  textarea { resize: vertical; min-height: 96px; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 2px solid var(--destaque);
    outline-offset: 1px;
  }
  button {
    width: 100%;
    margin-top: 6px;
    padding: 12px;
    border: 0;
    border-radius: 6px;
    background: var(--destaque);
    color: #fff;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: wait; }
  #msg { margin: 16px 0 0; min-height: 1.3em; font-size: .92rem; }
  #msg.ok { color: var(--ok); }
  #msg.erro { color: var(--erro); }
</style>
</head>
<body>
<main>
  <h1>Registrar demanda</h1>
  <p class="sub">Informe a demanda, quem pode resolvê-la e os detalhes.</p>

  <form id="form-demanda">
    <label>Demanda
      <input type="text" name="titulo" required maxlength="100"
             placeholder="Ex.: Animal mancando no recinto 4">
    </label>

    <label>Cargo que pode resolver
      <select name="cargoResponsavel" required>
        <option value="" disabled selected>Selecione o cargo</option>
        <option>Médico veterinário</option>
        <option>Tratador</option>
        <option>Biólogo</option>
        <option>Zootecnista</option>
        <option>Manutenção</option>
        <option>Segurança</option>
        <option>Limpeza</option>
        <option>Educador ambiental</option>
      </select>
    </label>

    <label>Descrição
      <textarea name="descricao" maxlength="500"
                placeholder="Descreva o que está acontecendo"></textarea>
    </label>

    <button type="submit" id="btn">Registrar demanda</button>
    <p id="msg" role="status" aria-live="polite"></p>
  </form>
</main>

<script>
  // Endereço do DemandaController (@RequestMapping("demandas"))
  const API_URL = "http://localhost:8080/demandas";

  const form = document.getElementById("form-demanda");
  const msg = document.getElementById("msg");
  const btn = document.getElementById("btn");

  function mostrar(texto, tipo) {
    msg.textContent = texto;
    msg.className = tipo;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    // Chaves iguais aos atributos da classe Demanda. O id é gerado pela API.
    const demanda = {
      titulo: form.titulo.value.trim(),
      cargoResponsavel: form.cargoResponsavel.value,
      descricao: form.descricao.value.trim()
    };

    btn.disabled = true;
    mostrar("Enviando...", "");

    try {
      const resposta = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(demanda)
      });

      if (!resposta.ok) {
        throw new Error("A API respondeu com status " + resposta.status);
      }

      mostrar("Demanda registrada com sucesso.", "ok");
      form.reset();
    } catch (erro) {
      mostrar("Não foi possível registrar. " + erro.message +
        ". Verifique se a API está rodando.", "erro");
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
